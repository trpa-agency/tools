name: Refresh TRPA Mention Monitor

# Reruns the collector in qa/general/mention-monitor/ and commits data/ to main,
# so the app on GitHub Pages updates without anyone running it locally.
#
# If an agency site or news feed refuses GitHub's servers, the collector keeps
# that source's last results and flags it on the app's "Sources checked" tab,
# so check that tab after the first few runs.
#
# Don't also schedule schedule_daily.ps1 -Publish against this copy, or the
# two will push competing data commits.
on:
  schedule:
    # Sunday and Wednesday nights. Cron is UTC: 05:00 UTC Mon/Thu is
    # 9 p.m. Pacific in standard time and 10 p.m. in daylight time.
    - cron: "0 5 * * 1,4"
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: mention-monitor-refresh
  cancel-in-progress: false

defaults:
  run:
    working-directory: qa/general/mention-monitor

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit step rebases onto origin/main, which cannot work against
          # the single-commit shallow clone checkout makes by default.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qa/general/mention-monitor/requirements.txt

      # The summary PDF uses Calibri; Carlito is its metric-compatible stand-in on Linux
      - name: Install Carlito font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-crosextra-carlito

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          PYTHONIOENCODING: utf-8
        run: python -m trpa_monitor

      - name: Commit data if it changed
        run: |
          if git diff --quiet -- data; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh TRPA Mention Monitor data ($(date -u '+%Y-%m-%d'))"
          # Rebase rather than force: a concurrent commit to main must not be lost.
          git pull --rebase --autostash origin main
          git push
