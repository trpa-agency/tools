<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 266" width="400" height="266" role="img"
     aria-label="Bicycle and pedestrian counts prototype: counter sites around Lake Tahoe and a monthly bar chart">
  <!-- Page background, the Dashboard card body -->
  <rect width="400" height="266" fill="#f7f7f7"/>
  <!-- Monitoring Dashboard card header -->
  <rect width="400" height="26" fill="#789440"/>
  <text x="12" y="18" font-family="Lexend Deca, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.6">DASHBOARD</text>

  <!-- Map card -->
  <rect x="12" y="38" width="186" height="216" rx="4" fill="#ffffff" stroke="#efefef"/>
  <rect x="12" y="38" width="186" height="22" rx="4" fill="#efefef"/>
  <text x="22" y="53" font-family="Lexend Deca, Arial, sans-serif" font-size="10" font-weight="600" fill="#3d3d3d">Sites</text>
  <!-- Lake outline -->
  <path d="M86 86 L112 92 L126 118 L128 152 L120 186 L104 212 L86 222 L70 210 L62 182 L60 150 L66 118 Z"
        fill="#dbe8f0" stroke="#b4cbe8" stroke-width="1.5"/>
  <!-- Counter sites -->
  <g fill="#789440" stroke="#ffffff" stroke-width="1.4">
    <circle cx="74" cy="104" r="4.2"/><circle cx="118" cy="98" r="4.2"/><circle cx="134" cy="140" r="4.2"/>
    <circle cx="130" cy="176" r="4.2"/><circle cx="100" cy="228" r="4.2"/><circle cx="78" cy="214" r="4.2"/>
    <circle cx="56" cy="166" r="4.2"/><circle cx="60" cy="128" r="4.2"/><circle cx="150" cy="108" r="4.2"/>
  </g>
  <!-- Selected site ring -->
  <circle cx="100" cy="228" r="8" fill="none" stroke="#e49937" stroke-width="2.5"/>
  <!-- Docked story popup -->
  <rect x="124" y="64" width="68" height="40" rx="3" fill="#ffffff" stroke="#dcdcdc"/>
  <rect x="130" y="70" width="40" height="5" rx="1" fill="#3d3d3d"/>
  <rect x="130" y="80" width="56" height="3" rx="1" fill="#bdbdbd"/>
  <rect x="130" y="87" width="50" height="3" rx="1" fill="#bdbdbd"/>
  <rect x="130" y="94" width="54" height="3" rx="1" fill="#bdbdbd"/>

  <!-- Chart card -->
  <rect x="208" y="38" width="180" height="216" rx="4" fill="#ffffff" stroke="#efefef"/>
  <rect x="208" y="38" width="180" height="22" rx="4" fill="#efefef"/>
  <text x="218" y="53" font-family="Lexend Deca, Arial, sans-serif" font-size="10" font-weight="600" fill="#3d3d3d">Monthly counts</text>
  <!-- Chart or table control -->
  <rect x="330" y="43" width="52" height="12" rx="2" fill="#ffffff" stroke="#789440"/>
  <rect x="330" y="43" width="26" height="12" rx="2" fill="#789440"/>
  <!-- Bars: a seasonal record -->
  <g fill="#789440">
    <rect x="222" y="200" width="9" height="36"/><rect x="234" y="170" width="9" height="66"/><rect x="246" y="120" width="9" height="116"/>
    <rect x="258" y="96" width="9" height="140"/><rect x="270" y="124" width="9" height="112"/><rect x="282" y="178" width="9" height="58"/>
    <rect x="294" y="212" width="9" height="24"/><rect x="306" y="206" width="9" height="30"/><rect x="318" y="164" width="9" height="72"/>
    <rect x="330" y="108" width="9" height="128"/><rect x="342" y="88" width="9" height="148"/><rect x="354" y="130" width="9" height="106"/>
    <rect x="366" y="188" width="9" height="48"/>
  </g>
  <!-- Typical month line -->
  <polyline points="226,196 238,176 250,130 262,104 274,128 286,182 298,208 310,200 322,166 334,112 346,100 358,134 370,186"
            fill="none" stroke="#2f3f56" stroke-width="2"/>
  <line x1="218" y1="236" x2="382" y2="236" stroke="#bdbdbd"/>
</svg>
