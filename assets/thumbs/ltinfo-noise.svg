<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 266" width="400" height="266" role="img"
     aria-label="Noise topic page prototype: narrative text with a chart of noise levels by land use against dashed standards">
  <!-- White page, a staff topic page inside the Lake Tahoe Info shell -->
  <rect width="400" height="266" fill="#ffffff"/>
  <rect width="400" height="26" fill="#2f3f56"/>
  <rect x="12" y="8" width="90" height="10" rx="2" fill="#ffffff" opacity="0.9"/>
  <rect y="26" width="400" height="12" fill="#789440"/>

  <!-- Section label and heading -->
  <text x="16" y="60" font-family="Lexend Deca, Arial, sans-serif" font-size="9" font-weight="700" fill="#789440" letter-spacing="0.8">PLAN AREA NOISE</text>
  <rect x="16" y="68" width="170" height="8" rx="2" fill="#3d3d3d"/>
  <!-- Narrative lines -->
  <g fill="#bdbdbd">
    <rect x="16" y="84" width="200" height="4" rx="1"/><rect x="16" y="92" width="188" height="4" rx="1"/>
    <rect x="16" y="100" width="196" height="4" rx="1"/><rect x="16" y="108" width="150" height="4" rx="1"/>
  </g>

  <!-- Chart card -->
  <rect x="16" y="124" width="368" height="128" rx="4" fill="#ffffff" stroke="#efefef"/>
  <rect x="16" y="124" width="368" height="20" rx="4" fill="#efefef"/>
  <text x="26" y="138" font-family="Lexend Deca, Arial, sans-serif" font-size="10" font-weight="600" fill="#3d3d3d">Average CNEL by land use category</text>
  <rect x="328" y="128" width="48" height="12" rx="2" fill="#ffffff" stroke="#789440"/>
  <rect x="328" y="128" width="24" height="12" rx="2" fill="#789440"/>
  <!-- Grid -->
  <g stroke="#dcdcdc"><line x1="40" y1="160" x2="372" y2="160"/><line x1="40" y1="184" x2="372" y2="184"/><line x1="40" y1="208" x2="372" y2="208"/><line x1="40" y1="232" x2="372" y2="232"/></g>
  <!-- Standards, dashed -->
  <g stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <line x1="40" y1="164" x2="372" y2="164" stroke="#789440"/>
    <line x1="40" y1="190" x2="372" y2="190" stroke="#2f3f56"/>
    <line x1="40" y1="214" x2="372" y2="214" stroke="#b5a64c"/>
  </g>
  <!-- Series -->
  <g fill="none" stroke-width="2.2">
    <polyline points="52,180 104,176 156,172 208,186 260,176 312,188 364,186" stroke="#789440"/>
    <polyline points="52,196 104,200 156,198 208,194 260,192 312,200 364,206" stroke="#2f3f56"/>
    <polyline points="52,218 104,214 156,212 208,206 260,224 312,216 364,222" stroke="#b5a64c"/>
  </g>
  <g stroke="#ffffff" stroke-width="1.2">
    <g fill="#789440"><circle cx="52" cy="180" r="3"/><circle cx="104" cy="176" r="3"/><circle cx="156" cy="172" r="3"/><circle cx="208" cy="186" r="3"/><circle cx="260" cy="176" r="3"/><circle cx="312" cy="188" r="3"/><circle cx="364" cy="186" r="3"/></g>
    <g fill="#2f3f56"><circle cx="52" cy="196" r="3"/><circle cx="104" cy="200" r="3"/><circle cx="156" cy="198" r="3"/><circle cx="208" cy="194" r="3"/><circle cx="260" cy="192" r="3"/><circle cx="312" cy="200" r="3"/><circle cx="364" cy="206" r="3"/></g>
    <g fill="#b5a64c"><circle cx="52" cy="218" r="3"/><circle cx="104" cy="214" r="3"/><circle cx="156" cy="212" r="3"/><circle cx="208" cy="206" r="3"/><circle cx="260" cy="224" r="3"/><circle cx="312" cy="216" r="3"/><circle cx="364" cy="222" r="3"/></g>
  </g>
  <line x1="40" y1="240" x2="372" y2="240" stroke="#bdbdbd"/>
</svg>
