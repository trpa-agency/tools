  <rect y="16" width="400" height="26" fill="#2f3f56"/>
  <circle cx="22" cy="29" r="7" fill="#89bf40"/>
  <rect x="34" y="24" width="70" height="7" rx="1" fill="#ffffff"/>
  <rect x="34" y="33" width="44" height="4" rx="1" fill="#ffffff" opacity="0.7"/>
  <rect y="42" width="400" height="14" fill="#ffffff" stroke="#e3e3e3"/>
