  <!-- Review toolbar -->
  <rect width="400" height="16" fill="#fff7e6"/>
  <rect x="8" y="5" width="60" height="6" rx="1" fill="#5c4300" opacity="0.7"/>
  <rect x="300" y="4" width="40" height="8" rx="1" fill="#ffffff" stroke="#d9c38a"/>
  <rect x="346" y="4" width="46" height="8" rx="1" fill="#ffffff" stroke="#d9c38a"/>
