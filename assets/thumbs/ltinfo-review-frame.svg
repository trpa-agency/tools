  <rect x="16" y="78" width="140" height="9" rx="2" fill="#3e72b0"/>
  <g fill="#bdbdbd"><rect x="16" y="94" width="300" height="4" rx="1"/><rect x="16" y="102" width="240" height="4" rx="1"/></g>
  <!-- Program overview card -->
