<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 266" width="400" height="266" role="img"
     aria-label="LT Info page prototypes review frame: a mock Lake Tahoe Info page with a TRPA prototype in the Dashboard card">
