  <g fill="#cdd7e3"><rect x="12" y="87" width="34" height="3" rx="1"/><rect x="56" y="87" width="30" height="3" rx="1"/><rect x="96" y="87" width="38" height="3" rx="1"/><rect x="144" y="87" width="34" height="3" rx="1"/></g>

