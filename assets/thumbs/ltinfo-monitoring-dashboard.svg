    <rect x="12" y="135" width="101" height="27" rx="3" fill="#ffffff"/><rect x="12" y="135" width="101" height="9" rx="3" fill="#675ea1"/><rect x="12" y="160" width="101" height="2" fill="#675ea1"/><rect x="20" y="149" width="44" height="4" rx="1" fill="#3d3d3d"/>
